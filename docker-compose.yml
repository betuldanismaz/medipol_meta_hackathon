services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      CORS_ORIGINS: http://localhost:3000
      PORT: 8000
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./output:/output:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Dev override: production Dockerfile prod komutu çalıştırır; burada reload modunu açıyoruz
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      target: deps
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL_INTERNAL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # Dev override: deps stage'inde sadece node_modules var; dev sunucusunu burada başlatıyoruz
    working_dir: /app
    command: ["npm", "run", "dev"]

volumes:
  db_data:
